[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "deskpilot"
version = "0.1.0"
description = "Organize files, find documents, and create screenshot guides locally"
requires-python = ">=3.11"
dependencies = ["flaxon>=0.2.5", "teloce-py>=0.2.6", "minifyjs==0.1.3", "uvicorn>=0.30,<1", "Pillow>=11,<13", "reportlab>=4,<5"]

[project.optional-dependencies]
desktop = ["pywebview>=6,<7"]
test = ["pytest>=8,<10"]
build = ["pyinstaller>=6,<7"]

[project.scripts]
deskpilot = "deskpilot.launcher:main"

[tool.setuptools.package-data]
deskpilot = ["ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
