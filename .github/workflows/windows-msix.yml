name: Test and build Windows MSIX
on:
  workflow_dispatch:
    inputs:
      flaxon_ref:
        description: Flaxon ref (use main after the integration fix is merged)
        default: fix/teloce-integration
      teloce_ref:
        description: Teloce ref containing the production MinifyJS integration
        default: main
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: aldanedev-create/flaxon
          ref: ${{ inputs.flaxon_ref || 'fix/teloce-integration' }}
          path: vendor/flaxon
      - uses: actions/checkout@v4
        with:
          repository: aldanedev-create/teloce-py
          ref: ${{ inputs.teloce_ref || 'main' }}
          path: vendor/teloce
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install editable frameworks and published MinifyJS
        run: |
          python -m pip install --upgrade pip
          python -m pip install minifyjs==0.1.3 pyyaml "tree-sitter>=0.25,<0.27" "tree-sitter-javascript>=0.23,<0.26" "tree-sitter-typescript>=0.23,<0.24" "uvicorn>=0.30,<1" "Pillow>=11,<13" "reportlab>=4,<5" "pywebview>=6,<7" "pyinstaller>=6,<7" "pytest>=8,<10" playwright==1.58.0
          python -m pip install -e vendor/teloce -e vendor/flaxon -e . --no-deps
          python -m pip freeze > build-environment.txt
      - name: Verify published MinifyJS and production backend
        run: python packaging/verify_minifyjs.py
      - name: Test file operations and production integration
        run: python -m pytest -q
      - name: Test application in Chromium
        env:
          DESKPILOT_BROWSER_TESTS: '1'
        run: |
          python -m playwright install chromium
          python -m pytest tests/test_browser.py -q
      - name: Build validated MSIX
        shell: pwsh
        run: |
          $identity = '${{ vars.MSIX_IDENTITY_NAME }}'
          $publisher = '${{ vars.MSIX_PUBLISHER }}'
          if (-not $identity) { $identity = 'DeskPilot.LocalWorkspace' }
          if (-not $publisher) { $publisher = 'CN=DeskPilotDevelopment' }
          ./packaging/build_msix.ps1 -IdentityName $identity -Publisher $publisher
      - uses: actions/upload-artifact@v4
        with:
          name: DeskPilot-Windows-x64
          path: |
            dist/DeskPilot.msix
            dist/DeskPilot/**
            build-environment.txt
