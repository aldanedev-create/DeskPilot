<template>
  <section>
    <div v-if="error" class="notice error" role="alert">{{ error }}</div>
    <div v-if="message" class="notice success" role="status">{{ message }}</div>
    <div v-if="busy" class="notice" role="status">Working… Please wait.</div>
    <div class="stats">
      <article>
        <small>Connected folders</small><strong>{{ roots.length }}</strong>
      </article>
      <article>
        <small>Indexed files</small><strong>{{ documentCount }}</strong>
      </article>
      <article>
        <small>Saved guides</small><strong>{{ guides.length }}</strong>
      </article>
    </div>
    <section class="panel">
      <div class="panel-head">
        <div>
          <h2>Choose a folder</h2>
          <p>You control what DeskHELP can organize.</p>
        </div>
        <button @click="chooseFolder" :disabled="busy">Browse folders</button>
      </div>
      <div class="row">
        <input
          v-model="folderPath"
          placeholder="Or enter a full folder path"
          aria-label="Folder path"
        /><button class="secondary" @click="addFolder" :disabled="busy">
          Connect folder
        </button>
      </div>
      <label class="field"
        >Active folder<select v-model="selectedRoot" @change="folderChanged">
          <option value="">Select a folder</option>
          <option v-for="root in roots" :key="root.id" :value="root.id">
            {{ root.path }}
          </option>
        </select></label
      >
      <div class="row">
        <label
          >Group files by<select v-model="sortMode" @change="clearPreview">
            <option value="type">File type</option>
            <option value="month">Modified month (YYYY-MM)</option>
          </select></label
        >
        <label
          >Only extension<input
            v-model="sortExtension"
            @input="clearPreview"
            placeholder="Leave blank for all"
            aria-label="Sorting extension"
        /></label>
        <label
          >Older than (days)<input
            type="number"
            min="0"
            v-model="olderDays"
            @input="clearPreview"
        /></label>
      </div>
      <div class="row">
        <button @click="previewSort" :disabled="busy">Preview sorting</button
        ><button class="secondary" @click="findDuplicates" :disabled="busy">
          Find exact duplicates</button
        ><button class="secondary" @click="indexFolder" :disabled="busy">
          Refresh index</button
        ><button class="secondary" @click="disconnectFolder" :disabled="busy">
          Disconnect folder
        </button>
      </div>
      <p class="hint">
        Choose file-type or modified-month groups. Filter by extension and age.
        Preview first, then select which files to move. Connecting a folder
        indexes names, metadata and supported text contents locally. Duplicates
        are never deleted.
      </p>
    </section>
    <section v-if="preview" class="panel">
      <div class="panel-head">
        <h2>Review before moving</h2>
        <button @click="applySort" :disabled="busy">Move these files</button>
      </div>
      <p class="hint">
        Existing destinations are never overwritten. Undo is available for
        completed moves.
      </p>
      <div class="row">
        <button class="secondary" @click="selectAllMoves">
          Select ready files</button
        ><button class="secondary" @click="clearMoves">Clear selection</button>
      </div>
      <div class="file-row" v-for="move in preview.moves" :key="move.source">
        <label class="check"
          ><input
            type="checkbox"
            v-model="move.selected"
            :disabled="move.conflict"
          />
          {{ move.source }}<small>→ {{ move.destination }}</small></label
        >
        <span v-if="move.conflict" class="badge warning">Conflict</span
        ><span v-else class="badge">Ready</span>
      </div>
      <p v-if="preview.moves.length === 0">No top-level files to sort.</p>
    </section>
    <section v-if="duplicateGroups.length" class="panel">
      <h2>Identical content</h2>
      <p>Review these groups yourself. DeskHELP does not delete them.</p>
      <div class="duplicate" v-for="group in duplicateGroups" :key="group[0]">
        <div v-for="path in group" :key="path">{{ path }}</div>
      </div>
    </section>
    <section v-if="batches.length" class="panel">
      <h2>Move history</h2>
      <div class="file-row" v-for="batch in batches" :key="batch.batch">
        <div>{{ batch.count }} files moved<small>{{ batch.batch }}</small></div>
        <button
          class="secondary"
          @click="undoSort(batch.batch)"
          :disabled="busy"
        >
          Undo moves
        </button>
      </div>
    </section>
  </section>
</template>
<script>
  export default {
    props: ["token"],
    data() {
      return {
        roots: [],
        documents: [],
        guides: [],
        batches: [],
        documentCount: 0,
        sortMode: "type",
        sortExtension: "",
        olderDays: 0,
        folderPath: "",
        selectedRoot: "",
        preview: null,
        duplicateGroups: [],
        busy: false,
        error: "",
        message: "",
      };
    },
    async mounted() {
      await this.task(() => this.refresh());
    },
    methods: {
      async api(path, payload) {
        const response = await fetch("/api/" + path, {
          method: payload ? "POST" : "GET",
          headers: {
            "content-type": "application/json",
            "x-deskpilot-token": this.token,
          },
          body: payload ? JSON.stringify(payload) : undefined,
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Request failed");
        return result;
      },
      async task(action) {
        if (this.busy) return;
        this.busy = true;
        this.error = "";
        this.message = "";
        try {
          await action();
        } catch (error) {
          this.error = error.message;
        } finally {
          this.busy = false;
        }
      },
      async refresh() {
        const state = await this.api("state");
        this.roots = state.roots;
        this.documents = state.documents;
        this.documentCount = state.document_count;
        this.guides = state.guides;
        this.batches = state.batches;
        if (state.recovery && state.recovery.length)
          this.error =
            "An interrupted move needs manual review. Check the source and destination files before sorting again.";
      },
      async chooseFolder() {
        if (window.pywebview) {
          const path = await window.pywebview.api.choose_folder();
          if (path) {
            this.folderPath = path;
            await this.addFolder();
          }
        } else {
          this.message =
            "Enter a folder path below. Native folder browsing is available in the desktop app.";
        }
      },
      async addFolder() {
        await this.task(async () => {
          const root = await this.api("roots", { path: this.folderPath });
          this.selectedRoot = root.id;
          this.folderChanged();
          await this.refresh();
          this.message = "Folder connected and indexed.";
        });
      },
      clearPreview() {
        this.preview = null;
      },
      folderChanged() {
        this.preview = null;
        this.duplicateGroups = [];
      },
      rootPayload() {
        if (!this.selectedRoot)
          throw new Error("Choose an active folder first");
        return { root: Number(this.selectedRoot) };
      },
      async previewSort() {
        await this.task(async () => {
          this.preview = await this.api("preview", {
            ...this.rootPayload(),
            mode: this.sortMode,
            extension: this.sortExtension,
            older_days: Number(this.olderDays) || 0,
          });
          this.preview.moves = this.preview.moves.map((move) => ({
            ...move,
            selected: !move.conflict,
          }));
        });
      },
      async applySort() {
        await this.task(async () => {
          if (!this.preview) throw new Error("Preview sorting first");
          const selected = this.preview.moves
            .filter((move) => move.selected && !move.conflict)
            .map((move) => move.source);
          if (!selected.length)
            throw new Error("Select at least one ready file");
          let result;
          try {
            result = await this.api("apply", {
              token: this.preview.token,
              selected,
            });
          } catch (error) {
            this.preview = null;
            await this.refresh();
            throw error;
          }
          this.preview = null;
          await this.api("index", this.rootPayload());
          await this.refresh();
          this.message =
            result.moved + " files moved. Undo is available below.";
        });
      },
      selectAllMoves() {
        this.preview.moves.forEach((move) => {
          move.selected = !move.conflict;
        });
      },
      clearMoves() {
        this.preview.moves.forEach((move) => {
          move.selected = false;
        });
      },
      async disconnectFolder() {
        await this.task(async () => {
          const payload = this.rootPayload();
          if (
            !window.confirm(
              "Disconnect this folder and remove its library records? Files will remain untouched. Undo history is retained.",
            )
          )
            return;
          await this.api("disconnect", payload);
          this.selectedRoot = "";
          this.preview = null;
          this.duplicateGroups = [];
          await this.refresh();
          this.message = "Folder disconnected. Files were not changed.";
        });
      },
      async undoSort(batch) {
        await this.task(async () => {
          const result = await this.api("undo", { batch });
          await this.refresh();
          this.message = result.restored + " files restored.";
        });
      },
      async indexFolder() {
        await this.task(async () => {
          const result = await this.api("index", this.rootPayload());
          await this.refresh();
          this.message = result.indexed + " files indexed.";
          if (result.warnings?.length) this.error = result.warnings.join(" · ");
        });
      },
      async findDuplicates() {
        await this.task(async () => {
          this.duplicateGroups = (
            await this.api("duplicates", this.rootPayload())
          ).groups;
          if (!this.duplicateGroups.length)
            this.message = "No exact duplicates found.";
        });
      },
    },
  };
</script>
