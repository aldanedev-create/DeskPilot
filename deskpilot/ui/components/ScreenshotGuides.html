<template>

    <div v-if="message" class="notice success" role="status">{{ message }}</div>
    <div v-if="busy" class="notice" role="status">Working… Please wait.</div>
    <div class="guide-layout">
      <section class="panel">
        <div class="panel-head">
          <h2>Your guides</h2>
          <button class="secondary" @click="newGuide">New guide</button>
        </div>
        <button
          class="guide-card"
          v-for="guide in guides"
          :key="guide.id"
          @click="loadGuide(guide)"
        >
          <strong>{{ guide.title }}</strong
          ><small>{{ guide.steps.length }} steps</small>
        </button>
        <p v-if="guides.length === 0" class="hint">
          Turn a few screenshots into a clear explanation.
        </p>
      </section>
      <section class="panel">
        <label class="field"
          >Guide title<input
            v-model="guideTitle"
            placeholder="How to submit an expense" /></label
        ><label class="upload"
          >＋ Import a screenshot<input
            type="file"
            accept="image/png,image/jpeg,image/webp"
            @change="importScreenshot($event)"
        /></label>
        <p class="hint">
          Import PNG, JPEG or WebP, up to 8 MB. Add annotations before saving.
        </p>
        <div v-if="steps.length" class="editor">
          <div class="row">
            <label
              >Annotation tool<select v-model="annotationTool">
                <option value="box">Box</option>
                <option value="arrow">Arrow</option>
                <option value="text">Text</option>
                <option value="ellipse">Ellipse</option>
                <option value="pen">Freehand pen</option>
                <option value="highlighter">Highlighter</option>
                <option value="eraser">Annotation eraser</option>
                <option value="redact">Solid redaction</option>
                <option value="crop">Crop (drag a rectangle)</option>
              </select></label
            ><input
              v-model="annotationText"
              placeholder="Text annotation"
              aria-label="Annotation text"
            /><label
              >Color<input type="color" v-model="annotationColor" /></label
            ><label
              >Stroke / eraser size<input
                type="number"
                min="1"
                max="100"
                v-model="strokeWidth" /></label
            ><label
              >Text size<input
                type="number"
                min="8"
                max="160"
                v-model="textSize" /></label
            ><button class="secondary" @click="undoImage">Undo edit</button
            ><button class="secondary" @click="redoImage">Redo edit</button
            ><button class="secondary" @click="resetAnnotation">
              Reset drawing</button
            ><button @click="keepAnnotation" :disabled="busy">
              Keep annotations
            </button>
          </div>
          <div class="row">
            <button class="secondary" @click="rotateImage">Rotate 90°</button
            ><button class="secondary" @click="flipImage">
              Flip horizontal</button
            ><label
              >Brightness<input
                type="number"
                min="0"
                max="200"
                v-model="brightness" /></label
            ><label
              >Contrast<input
                type="number"
                min="0"
                max="200"
                v-model="contrast" /></label
            ><label
              >Saturation<input
                type="number"
                min="0"
                max="200"
                v-model="saturation" /></label
            ><button class="secondary" @click="adjustImage">
              Apply adjustments
            </button>
          </div>
          <p class="hint">
            Eraser removes current annotation strokes, preserving the
            screenshot. Undo/redo supports up to 60 edits before Keep
            annotations. Crop and transformations are reversible until kept.
            Large images are fitted to 4 megapixels. Save guide automatically
            keeps the active edits. Solid redaction hides pixels in exported
            images; the imported original remains in local app data.
          </p>
          <p role="status">{{ editorStatus }}</p>
          <canvas
            id="annotation-canvas"
            @pointerdown="startDrawing($event)"
            @pointermove="continueDrawing($event)"
            @pointerup="finishDrawing($event)"
            @pointercancel="cancelDrawing"
            @keydown="editorKey($event)"
            tabindex="0"
            aria-label="Screenshot annotation canvas"
          ></canvas>
        </div>

            <strong>Step {{ steps.indexOf(step) + 1 }}</strong>
            <div class="row">
              <button class="small secondary" @click="moveStep(step,-1)">
                ↑</button
              ><button class="small secondary" @click="moveStep(step,1)">
                ↓</button

              ><button class="small secondary" @click="duplicateStep(step)">
                Duplicate step
              </button>
            </div>
          </div>
          <input

            aria-label="Step title"
          /><textarea

            placeholder="Explain this step"
            aria-label="Step description"
          ></textarea>
        </article>
        <div class="row">
          <button @click="saveGuide" :disabled="busy">Save guide</button
          ><button class="secondary" @click="exportGuide" :disabled="busy">
            Export PDF
          </button>
        </div>
      </section>
    </div>
  </section>
</template>
<script>
  import { ImageEditor } from "../../assets/image-editor.js";
  export default {
    props: ["token"],
    data() {
      return {
        roots: [],
        documents: [],
        guides: [],
        batches: [],
        guideId: null,
        guideTitle: "",
        steps: [],
        editingKey: null,
        annotationTool: "box",
        annotationText: "",
        annotationColor: "#ff573b",
        strokeWidth: 6,
        textSize: 28,
        brightness: 100,
        contrast: 100,
        saturation: 100,
        editorStatus: "Loading image…",
        busy: false,
        error: "",
        message: "",
      };
    },
    async mounted() {
      await this.task(() => this.refresh());
    },
    methods: {
      async api(path, payload) {
        const response = await fetch("/api/" + path, {
          method: payload ? "POST" : "GET",
          headers: {
            "content-type": "application/json",
            "x-deskpilot-token": this.token,
          },
          body: payload ? JSON.stringify(payload) : undefined,
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Request failed");
        return result;
      },
      async task(action) {
        if (this.busy) return;
        this.busy = true;
        this.error = "";
        this.message = "";
        try {
          await action();
        } catch (error) {
          this.error = error.message;
        } finally {
          this.busy = false;
        }
      },
      async refresh() {
        const state = await this.api("state");
        this.roots = state.roots;
        this.documents = state.documents;
        this.guides = state.guides;
        this.batches = state.batches;
        if (state.recovery && state.recovery.length)
          this.error =
            "An interrupted move needs manual review. Check the source and destination files before sorting again.";
      },
      confirmDiscard() {
        return (
          !this._editor?.dirty ||
          window.confirm(
            "Discard the current unkept image edits? Choose Cancel and Keep annotations to retain them.",
          )
        );
      },
      newGuide() {
        if (!this.confirmDiscard()) return;
        this._editor = null;
        this.guideId = null;
        this.guideTitle = "";
        this.steps = [];
        this.editingKey = null;
      },
      loadGuide(guide) {
        if (!this.confirmDiscard()) return;
        this._editor = null;
        this.guideId = guide.id;
        this.guideTitle = guide.title;
        this.steps = guide.steps.map((step) => ({
          ...step,
          key: crypto.randomUUID(),
        }));
        this.editingKey = this.steps[0]?.key;
        setTimeout(() => this.drawImage(), 50);
      },
      async importScreenshot(event) {
        const file = event.target.files[0];
        if (!file) return;
        if (!this.confirmDiscard()) return;
        await this.task(async () => {
          if (file.size > 8 * 1024 * 1024)
            throw new Error("Choose an image smaller than 8 MB");
          const data = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });
          const result = await this.api("images", { data });
          const step = {
            image: result.image,
            title: file.name,
            description: "",
            key: crypto.randomUUID(),
          };
          this.steps.push(step);
          this.editingKey = step.key;
          setTimeout(() => this.drawImage(), 50);
        });
        event.target.value = "";
      },
      editStep(step) {
        if (!this.confirmDiscard()) return;
        this.editingKey = step.key;
        this.drawImage();
      },
      drawImage() {
        const step = this.steps.find((item) => item.key === this.editingKey);
        const canvas = document.getElementById("annotation-canvas");
        this._editor = null;
        if (!step || !canvas) return;
        const key = step.key;
        const generation = (this._imageGeneration || 0) + 1;
        this._imageGeneration = generation;
        const image = new Image();
        this.editorStatus = "Loading image…";
        image.onload = () => {
          if (this.editingKey !== key || generation !== this._imageGeneration)
            return;
          this._editor = new ImageEditor(canvas, image);
          this.editorStatus =
            canvas.width + " × " + canvas.height + " pixels · Ready";
        };
        image.onerror = () => {
          this.error = "Screenshot could not load. Re-import it.";
        };
        image.src =
          "/image/" + step.image + "?token=" + encodeURIComponent(this.token);
      },
      imageAction(action) {
        try {
          if (!this._editor) throw new Error("Wait for the screenshot to load");
          action(this._editor);
          this.editorStatus =
            this._editor.canvas.width +
            " × " +
            this._editor.canvas.height +
            " pixels · " +
            this._editor.commands.length +
            " edits";
        } catch (error) {
          this.error = error.message;
        }
      },
      resetAnnotation() {
        if (window.confirm("Reset all unkept edits on this image?"))
          this.imageAction((editor) => editor.reset());
      },
      undoImage() {
        this.imageAction((editor) => editor.undo());
      },
      redoImage() {
        this.imageAction((editor) => editor.redo());
      },
      rotateImage() {
        this.imageAction((editor) => editor.commit({ tool: "rotate" }));
      },
      flipImage() {
        this.imageAction((editor) => editor.commit({ tool: "flip" }));
      },
      adjustImage() {
        this.imageAction((editor) =>
          editor.commit({
            tool: "adjust",
            brightness: Math.max(
              0,
              Math.min(200, Number(this.brightness) || 0),
            ),
            contrast: Math.max(0, Math.min(200, Number(this.contrast) || 0)),
            saturation: Math.max(
              0,
              Math.min(200, Number(this.saturation) || 0),
            ),
          }),
        );
      },
      editorKey(event) {
        if (
          (event.ctrlKey || event.metaKey) &&
          event.key.toLowerCase() === "z"
        ) {
          event.preventDefault();
          event.shiftKey ? this.redoImage() : this.undoImage();
        }
      },
      startDrawing(event) {
        if (this.busy) return;
        this.imageAction((editor) =>
          editor.begin(event, {
            tool: this.annotationTool,
            color: this.annotationColor,
            width: Math.max(1, Math.min(100, Number(this.strokeWidth) || 6)),
            fontSize: Math.max(8, Math.min(160, Number(this.textSize) || 28)),
            text: this.annotationText,
          }),
        );
      },
      continueDrawing(event) {
        if (this._editor?.draft)
          this.imageAction((editor) => editor.move(event));
      },
      finishDrawing(event) {
        this.imageAction((editor) => editor.end(event));
      },
      cancelDrawing() {
        this._editor?.cancel();
      },
      duplicateStep(step) {
        if (this.steps.length >= 30) {
          this.error = "A guide supports up to 30 steps";
          return;
        }
        this.steps = [...this.steps, { ...step, key: crypto.randomUUID() }];
      },
      async persistImage() {
        const step = this.steps.find((item) => item.key === this.editingKey);
        if (!step || !this._editor?.dirty) return;
        const canvas = this._editor.canvas;
        const result = await this.api("images", {
          data: canvas.toDataURL("image/png"),
        });
        step.image = result.image;
        // Bake edits into a new source; the server never modifies the imported image.
        await new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => {
            this._editor = new ImageEditor(canvas, image);
            resolve();
          };
          image.onerror = () =>
            reject(new Error("Saved screenshot could not load"));
          image.src =
            "/image/" + step.image + "?token=" + encodeURIComponent(this.token);
        });
        this.editorStatus = "Edits kept";
      },
      async exportImage() {
        await this.task(async () => {
          await this.persistImage();
          const step = this.steps.find((item) => item.key === this.editingKey);
          if (!step) throw new Error("Choose a step");
          if (window.pywebview)
            this.message =
              (await window.pywebview.api.export_image(step.image)) ||
              "Export cancelled.";
          else {
            const response = await fetch(
              "/image/" +
                step.image +
                "?token=" +
                encodeURIComponent(this.token),
            );
            if (!response.ok) throw new Error("Screenshot could not download");
            const url = URL.createObjectURL(await response.blob());
            const link = document.createElement("a");
            link.href = url;
            link.download = "screenshot.png";
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            this.message = "PNG download started.";
          }
        });
      },
      async keepAnnotation() {
        await this.task(async () => {
          await this.persistImage();
          this.message =
            "Annotations kept. Save the guide to persist the steps.";
        });
      },
      moveStep(step, direction) {
        const index = this.steps.indexOf(step);
        const target = index + direction;
        if (target < 0 || target >= this.steps.length) return;
        const items = [...this.steps];
        items.splice(index, 1);
        items.splice(target, 0, step);
        this.steps = items;
      },
      removeStep(step) {
        if (!this.confirmDiscard()) return;
        this.steps = this.steps.filter((item) => item.key !== step.key);
        this.editingKey = this.steps[0]?.key;
        setTimeout(() => this.drawImage(), 50);
      },
      async saveGuide() {
        await this.task(async () => {
          await this.persistImage();
          const guide = await this.api("guide", {
            id: this.guideId,
            title: this.guideTitle,
            steps: this.steps,
          });
          this.guideId = guide.id;
          await this.refresh();
          this.message = "Guide saved.";
        });
      },
      async exportGuide() {
        if (!this.guideId) {
          this.error = "Save the guide before exporting";
          return;
        }
        await this.task(async () => {
          if (window.pywebview) {
            const result = await window.pywebview.api.export_guide(
              this.guideId,
            );
            this.message = result || "Export cancelled.";
          } else {
            window.location.href =
              "/download/" +
              this.guideId +
              "?token=" +
              encodeURIComponent(this.token);
          }
        });
      },
    },
  };
</script>
