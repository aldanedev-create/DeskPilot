<template>
  <section>
    <div v-if="error" class="notice error" role="alert">{{ error }}</div>
    <div v-if="message" class="notice success" role="status">{{ message }}</div>
    <div v-if="busy" class="notice" role="status">Working… Please wait.</div>
    <div class="guide-layout">
      <section class="panel">
        <div class="panel-head">
          <h2>Your guides</h2>
          <button class="secondary" @click="newGuide">New guide</button>
        </div>
        <button
          class="guide-card"
          v-for="guide in guides"
          :key="guide.id"
          @click="loadGuide(guide)"
        >
          <strong>{{ guide.title }}</strong
          ><small>{{ guide.steps.length }} steps</small>
        </button>
        <p v-if="guides.length === 0" class="hint">
          Turn a few screenshots into a clear explanation.
        </p>
      </section>
      <section class="panel">
        <label class="field"
          >Guide title<input
            v-model="guideTitle"
            placeholder="How to submit an expense" /></label
        ><label class="upload"
          >＋ Import a screenshot<input
            type="file"
            accept="image/png,image/jpeg,image/webp"
            @change="importScreenshot($event)"
        /></label>
        <p class="hint">
          Import PNG, JPEG or WebP, up to 8 MB. Add annotations before saving.
        </p>
        <div v-if="steps.length" class="editor">
          <div class="row">
            <label
              >Annotation tool<select v-model="annotationTool">
                <option value="box">Box</option>
                <option value="arrow">Arrow</option>
                <option value="text">Text</option>
              </select></label
            ><input
              v-model="annotationText"
              placeholder="Text annotation"
              aria-label="Annotation text"
            /><button class="secondary" @click="resetAnnotation">
              Reset drawing</button
            ><button @click="keepAnnotation" :disabled="busy">
              Keep annotations
            </button>
          </div>
          <canvas
            id="annotation-canvas"
            @mousedown="startDrawing($event)"
            @mouseup="finishDrawing($event)"
            aria-label="Screenshot annotation canvas"
          ></canvas>
        </div>
        <article class="step" v-for="step in steps" :key="step.key">
          <div class="panel-head">
            <strong>Step {{ steps.indexOf(step) + 1 }}</strong>
            <div class="row">
              <button class="small secondary" @click="moveStep(step,-1)">
                ↑</button
              ><button class="small secondary" @click="moveStep(step,1)">
                ↓</button
              ><button class="small secondary" @click="editStep(step)">
                Annotate</button
              ><button class="small secondary" @click="removeStep(step)">
                Remove
              </button>
            </div>
          </div>
          <input
            v-model="step.title"
            placeholder="Step title"
            aria-label="Step title"
          /><textarea
            v-model="step.description"
            placeholder="Explain this step"
            aria-label="Step description"
          ></textarea>
        </article>
        <div class="row">
          <button @click="saveGuide" :disabled="busy">Save guide</button
          ><button class="secondary" @click="exportGuide" :disabled="busy">
            Export PDF
          </button>
        </div>
      </section>
    </div>
  </section>
</template>
<script>
  export default {
    props: ["token"],
    data() {
      return {
        roots: [],
        documents: [],
        guides: [],
        batches: [],
        guideId: null,
        guideTitle: "",
        steps: [],
        editingKey: null,
        annotationTool: "box",
        annotationText: "",
        busy: false,
        error: "",
        message: "",
      };
    },
    async mounted() {
      await this.task(() => this.refresh());
    },
    methods: {
      async api(path, payload) {
        const response = await fetch("/api/" + path, {
          method: payload ? "POST" : "GET",
          headers: {
            "content-type": "application/json",
            "x-deskpilot-token": this.token,
          },
          body: payload ? JSON.stringify(payload) : undefined,
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Request failed");
        return result;
      },
      async task(action) {
        if (this.busy) return;
        this.busy = true;
        this.error = "";
        this.message = "";
        try {
          await action();
        } catch (error) {
          this.error = error.message;
        } finally {
          this.busy = false;
        }
      },
      async refresh() {
        const state = await this.api("state");
        this.roots = state.roots;
        this.documents = state.documents;
        this.guides = state.guides;
        this.batches = state.batches;
        if (state.recovery && state.recovery.length)
          this.error =
            "An interrupted move needs manual review. Check the source and destination files before sorting again.";
      },
      newGuide() {
        this.guideId = null;
        this.guideTitle = "";
        this.steps = [];
        this.editingKey = null;
      },
      loadGuide(guide) {
        this.guideId = guide.id;
        this.guideTitle = guide.title;
        this.steps = guide.steps.map((step) => ({
          ...step,
          key: crypto.randomUUID(),
        }));
        this.editingKey = this.steps[0]?.key;
        setTimeout(() => this.drawImage(), 50);
      },
      async importScreenshot(event) {
        const file = event.target.files[0];
        if (!file) return;
        await this.task(async () => {
          if (file.size > 8 * 1024 * 1024)
            throw new Error("Choose an image smaller than 8 MB");
          const data = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });
          const result = await this.api("images", { data });
          const step = {
            image: result.image,
            title: file.name,
            description: "",
            key: crypto.randomUUID(),
          };
          this.steps.push(step);
          this.editingKey = step.key;
          setTimeout(() => this.drawImage(), 50);
        });
        event.target.value = "";
      },
      editStep(step) {
        this.editingKey = step.key;
        this.drawImage();
      },
      drawImage() {
        const step = this.steps.find((item) => item.key === this.editingKey);
        const canvas = document.getElementById("annotation-canvas");
        if (!step || !canvas) return;
        const image = new Image();
        image.onload = () => {
          canvas.width = image.width;
          canvas.height = image.height;
          canvas.getContext("2d").drawImage(image, 0, 0);
        };
        image.src =
          "/image/" + step.image + "?token=" + encodeURIComponent(this.token);
      },
      resetAnnotation() {
        this.drawImage();
      },
      startDrawing(event) {
        const canvas = event.currentTarget;
        const bounds = canvas.getBoundingClientRect();
        this._drawing = {
          x: ((event.clientX - bounds.left) * canvas.width) / bounds.width,
          y: ((event.clientY - bounds.top) * canvas.height) / bounds.height,
        };
      },
      finishDrawing(event) {
        if (!this._drawing) return;
        const canvas = event.currentTarget;
        const bounds = canvas.getBoundingClientRect();
        const end = {
          x: ((event.clientX - bounds.left) * canvas.width) / bounds.width,
          y: ((event.clientY - bounds.top) * canvas.height) / bounds.height,
        };
        const start = this._drawing;
        const context = canvas.getContext("2d");
        context.strokeStyle = "#ff573b";
        context.fillStyle = "#ff573b";
        context.lineWidth = Math.max(3, canvas.width / 250);
        if (this.annotationTool === "box") {
          context.strokeRect(
            start.x,
            start.y,
            end.x - start.x,
            end.y - start.y,
          );
        } else if (this.annotationTool === "text") {
          context.font = Math.max(20, canvas.width / 35) + "px Arial";
          context.fillText(this.annotationText, start.x, start.y);
        } else {
          const angle = Math.atan2(end.y - start.y, end.x - start.x);
          const size = Math.max(15, canvas.width / 50);
          context.beginPath();
          context.moveTo(start.x, start.y);
          context.lineTo(end.x, end.y);
          context.moveTo(
            end.x - size * Math.cos(angle - 0.5),
            end.y - size * Math.sin(angle - 0.5),
          );
          context.lineTo(end.x, end.y);
          context.lineTo(
            end.x - size * Math.cos(angle + 0.5),
            end.y - size * Math.sin(angle + 0.5),
          );
          context.stroke();
        }
        this._drawing = null;
      },
      async keepAnnotation() {
        await this.task(async () => {
          const step = this.steps.find((item) => item.key === this.editingKey);
          const canvas = document.getElementById("annotation-canvas");
          if (!step || !canvas) throw new Error("Choose a step");
          step.image = (
            await this.api("images", { data: canvas.toDataURL("image/png") })
          ).image;
          this.message =
            "Annotations kept. Save the guide to persist the steps.";
        });
      },
      moveStep(step, direction) {
        const index = this.steps.indexOf(step);
        const target = index + direction;
        if (target < 0 || target >= this.steps.length) return;
        const items = [...this.steps];
        items.splice(index, 1);
        items.splice(target, 0, step);
        this.steps = items;
      },
      removeStep(step) {
        this.steps = this.steps.filter((item) => item.key !== step.key);
        this.editingKey = this.steps[0]?.key;
        setTimeout(() => this.drawImage(), 50);
      },
      async saveGuide() {
        await this.task(async () => {
          const guide = await this.api("guide", {
            id: this.guideId,
            title: this.guideTitle,
            steps: this.steps,
          });
          this.guideId = guide.id;
          await this.refresh();
          this.message = "Guide saved.";
        });
      },
      async exportGuide() {
        if (!this.guideId) {
          this.error = "Save the guide before exporting";
          return;
        }
        await this.task(async () => {
          if (window.pywebview) {
            const result = await window.pywebview.api.export_guide(
              this.guideId,
            );
            this.message = result || "Export cancelled.";
          } else {
            window.location.href =
              "/download/" +
              this.guideId +
              "?token=" +
              encodeURIComponent(this.token);
          }
        });
      },
    },
  };
</script>
