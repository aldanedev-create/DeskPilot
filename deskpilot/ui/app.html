<script>
  export default {
    props: ["token"],
    data() {
      return {
        tab: "organize",
        roots: [],
        documents: [],
        guides: [],
        batches: [],
        folderPath: "",
        selectedRoot: "",
        preview: null,
        duplicateGroups: [],
        search: "",
        busy: false,
        error: "",
        message: "",
        guideId: null,
        guideTitle: "",
        steps: [],
        editingKey: null,
        annotationTool: "box",
        annotationText: "",
      };
    },
    async mounted() {
      await this.refresh();
    },
    methods: {
      pageTitle() {
        return {
          organize: "Make room for what matters.",
          library: "Everything important. Easy to find.",
          guides: "Show the steps. Share the know-how.",
        }[this.tab];
      },
      pageDescription() {
        return {
          organize: "Bring a little order to your everyday files.",
          library:
            "Find documents, add context, and keep important dates in view.",
          guides:
            "Build useful guides from screenshots, notes, and annotations.",
        }[this.tab];
      },
      selectTab(tab) {
        this.tab = tab;
        this.error = "";
        this.message = "";
        if (tab === "guides") setTimeout(() => this.drawImage(), 50);
      },
      async api(path, payload) {
        const response = await fetch("/api/" + path, {
          method: payload ? "POST" : "GET",
          headers: {
            "content-type": "application/json",
            "x-deskpilot-token": this.token,
          },
          body: payload ? JSON.stringify(payload) : undefined,
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Request failed");
        return result;
      },
      async task(action) {
        if (this.busy) return;
        this.busy = true;
        this.error = "";
        this.message = "";
        try {
          await action();
        } catch (error) {
          this.error = error.message;
        } finally {
          this.busy = false;
        }
      },
      async refresh() {
        const state = await this.api("state");
        this.roots = state.roots;
        this.documents = state.documents;
        this.guides = state.guides;
        this.batches = state.batches;
        if (state.recovery && state.recovery.length)
          this.error =
            "An interrupted move needs manual review. Check the source and destination files before sorting again.";
      },
      async chooseFolder() {
        if (window.pywebview) {
          const path = await window.pywebview.api.choose_folder();
          if (path) {
            this.folderPath = path;
            await this.addFolder();
          }
        } else {
          this.message =
            "Enter a folder path below. Native folder browsing is available in the desktop app.";
        }
      },
      async addFolder() {
        await this.task(async () => {
          const root = await this.api("roots", { path: this.folderPath });
          this.selectedRoot = root.id;
          await this.refresh();
          this.message = "Folder connected and indexed.";
        });
      },
      rootPayload() {
        if (!this.selectedRoot)
          throw new Error("Choose an active folder first");
        return { root: Number(this.selectedRoot) };
      },
      async previewSort() {
        await this.task(async () => {
          this.preview = await this.api("preview", this.rootPayload());
        });
      },
      async applySort() {
        await this.task(async () => {
          if (!this.preview) throw new Error("Preview sorting first");
          const result = await this.api("apply", { token: this.preview.token });
          this.preview = null;
          await this.api("index", this.rootPayload());
          await this.refresh();
          this.message =
            result.moved + " files moved. Undo is available below.";
        });
      },
      async undoSort(batch) {
        await this.task(async () => {
          const result = await this.api("undo", { batch });
          await this.refresh();
          this.message = result.restored + " files restored.";
        });
      },
      async indexFolder() {
        await this.task(async () => {
          const result = await this.api("index", this.rootPayload());
          await this.refresh();
          this.message = result.indexed + " files indexed.";
        });
      },
      async findDuplicates() {
        await this.task(async () => {
          this.duplicateGroups = (
            await this.api("duplicates", this.rootPayload())
          ).groups;
          if (!this.duplicateGroups.length)
            this.message = "No exact duplicates found.";
        });
      },
      filteredDocuments() {
        const query = this.search.toLowerCase();
        return this.documents.filter((document) =>
          (document.name + " " + document.path + " " + document.tags)
            .toLowerCase()
            .includes(query),
        );
      },
      isDue(expiry) {
        return (
          expiry &&
          new Date(expiry + "T23:59:59") <= new Date(Date.now() + 30 * 86400000)
        );
      },
      async saveDocument(document) {
        await this.task(async () => {
          await this.api("document", document);
          this.message = "Document details saved.";
        });
      },
      async revealDocument(id) {
        if (window.pywebview) await window.pywebview.api.reveal_document(id);
        else this.message = "Show in folder is available in the desktop app.";
      },
      newGuide() {
        this.guideId = null;
        this.guideTitle = "";
        this.steps = [];
        this.editingKey = null;
      },
      loadGuide(guide) {
        this.guideId = guide.id;
        this.guideTitle = guide.title;
        this.steps = guide.steps.map((step) => ({
          ...step,
          key: crypto.randomUUID(),
        }));
        this.editingKey = this.steps[0]?.key;
        setTimeout(() => this.drawImage(), 50);
      },
      async importScreenshot(event) {
        const file = event.target.files[0];
        if (!file) return;
        await this.task(async () => {
          if (file.size > 8 * 1024 * 1024)
            throw new Error("Choose an image smaller than 8 MB");
          const data = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });
          const result = await this.api("images", { data });
          const step = {
            image: result.image,
            title: file.name,
            description: "",
            key: crypto.randomUUID(),
          };
          this.steps.push(step);
          this.editingKey = step.key;
          setTimeout(() => this.drawImage(), 50);
        });
        event.target.value = "";
      },
      editStep(step) {
        this.editingKey = step.key;
        this.drawImage();
      },
      drawImage() {
        const step = this.steps.find((item) => item.key === this.editingKey);
        const canvas = document.getElementById("annotation-canvas");
        if (!step || !canvas) return;
        const image = new Image();
        image.onload = () => {
          canvas.width = image.width;
          canvas.height = image.height;
          canvas.getContext("2d").drawImage(image, 0, 0);
        };
        image.src =
          "/image/" + step.image + "?token=" + encodeURIComponent(this.token);
      },
      resetAnnotation() {
        this.drawImage();
      },
      startDrawing(event) {
        const canvas = event.currentTarget;
        const bounds = canvas.getBoundingClientRect();
        this._drawing = {
          x: ((event.clientX - bounds.left) * canvas.width) / bounds.width,
          y: ((event.clientY - bounds.top) * canvas.height) / bounds.height,
        };
      },
      finishDrawing(event) {
        if (!this._drawing) return;
        const canvas = event.currentTarget;
        const bounds = canvas.getBoundingClientRect();
        const end = {
          x: ((event.clientX - bounds.left) * canvas.width) / bounds.width,
          y: ((event.clientY - bounds.top) * canvas.height) / bounds.height,
        };
        const start = this._drawing;
        const context = canvas.getContext("2d");
        context.strokeStyle = "#ff573b";
        context.fillStyle = "#ff573b";
        context.lineWidth = Math.max(3, canvas.width / 250);
        if (this.annotationTool === "box") {
          context.strokeRect(
            start.x,
            start.y,
            end.x - start.x,
            end.y - start.y,
          );
        } else if (this.annotationTool === "text") {
          context.font = Math.max(20, canvas.width / 35) + "px Arial";
          context.fillText(this.annotationText, start.x, start.y);
        } else {
          const angle = Math.atan2(end.y - start.y, end.x - start.x);
          const size = Math.max(15, canvas.width / 50);
          context.beginPath();
          context.moveTo(start.x, start.y);
          context.lineTo(end.x, end.y);
          context.moveTo(
            end.x - size * Math.cos(angle - 0.5),
            end.y - size * Math.sin(angle - 0.5),
          );
          context.lineTo(end.x, end.y);
          context.lineTo(
            end.x - size * Math.cos(angle + 0.5),
            end.y - size * Math.sin(angle + 0.5),
          );
          context.stroke();
        }
        this._drawing = null;
      },
      async keepAnnotation() {
        await this.task(async () => {
          const step = this.steps.find((item) => item.key === this.editingKey);
          const canvas = document.getElementById("annotation-canvas");
          if (!step || !canvas) throw new Error("Choose a step");
          step.image = (
            await this.api("images", { data: canvas.toDataURL("image/png") })
          ).image;
          this.message =
            "Annotations kept. Save the guide to persist the steps.";
        });
      },
      moveStep(step, direction) {
        const index = this.steps.indexOf(step);
        const target = index + direction;
        if (target < 0 || target >= this.steps.length) return;
        const items = [...this.steps];
        items.splice(index, 1);
        items.splice(target, 0, step);
        this.steps = items;
      },
      removeStep(step) {
        this.steps = this.steps.filter((item) => item.key !== step.key);
        this.editingKey = this.steps[0]?.key;
        setTimeout(() => this.drawImage(), 50);
      },
      async saveGuide() {
        await this.task(async () => {
          const guide = await this.api("guide", {
            id: this.guideId,
            title: this.guideTitle,
            steps: this.steps,
          });
          this.guideId = guide.id;
          await this.refresh();
          this.message = "Guide saved.";
        });
      },
      async exportGuide() {
        if (!this.guideId) {
          this.error = "Save the guide before exporting";
          return;
        }
        await this.task(async () => {
          if (window.pywebview) {
            const result = await window.pywebview.api.export_guide(
              this.guideId,
            );
            this.message = result || "Export cancelled.";
          } else {
            window.location.href =
              "/download/" +
              this.guideId +
              "?token=" +
              encodeURIComponent(this.token);
          }
        });
      },
    },
  };
</script>
